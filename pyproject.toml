[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "memrecagent"
version = "0.1.0"
description = "Reproducible product recommendation for long-term preference memory research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
memrecagent = "memrecagent.__main__:main"

[project.optional-dependencies]
ml = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
]
api = [
    "fastapi>=0.150.0",
    "pydantic>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/memrecagent"]

[tool.hatch.build.targets.sdist]
exclude = ["/.tmp_pytest", "/.tmp_pytest/**"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
